[package]
name = "auth"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "The auth server and its break-glass CLI: the same service as ../src, in Rust."

[[bin]]
name = "auth"
path = "src/main.rs"

# Every dependency is code that runs with every credential in reach
# (docs/DESIGN.md §14), so the list is kept to what the standard library
# lacks: an async runtime and HTTP, Postgres, TLS, and audited cryptography.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util", "io-std", "fs"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "server-graceful"] }
http-body-util = "0.1"
bytes = "1"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.14"
tokio-postgres-rustls = "0.13"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = { version = "1", features = ["preserve_order"] }
ring = "0.17"
argon2 = "0.5"
bcrypt = "0.17"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
url = "2"
form_urlencoded = "1"
percent-encoding = "2"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
rustls-native-certs = "0.8"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
