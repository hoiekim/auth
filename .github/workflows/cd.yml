name: CD

# Publishes the image to Docker Hub after CI passes on a push to main. It
# deploys nothing: each deployment pulls the image it chooses, pinned by the
# digest this run records (docs/DEPLOYMENT.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Queue runs rather than cancel them: every run publishes main's tip (see
# "Resolve main's tip"), so a queued run that replaces another loses nothing.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  docker-push:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # CI runs for successive pushes can finish out of order, and the run
      # that triggered this one may be for a commit main has moved past, so
      # build main's tip instead, and only once CI has passed for it.
      # Otherwise do nothing: the tip's own CI run triggers CD again.
      - name: Resolve main's tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&status=success" --jq .total_count)
          if [ "$passed" -gt 0 ]; then
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          else
            echo "CI has not passed for main's tip $sha yet; its own CI run will publish it."
          fi

      - if: steps.tip.outputs.sha != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.tip.outputs.sha }}
          persist-credentials: false

      - if: steps.tip.outputs.sha != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: steps.tip.outputs.sha != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - if: steps.tip.outputs.sha != ''
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/auth:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/auth:sha-${{ steps.tip.outputs.short }}

      # The digest is what a deployment pins.
      - if: steps.tip.outputs.sha != ''
        name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          SHORT: ${{ steps.tip.outputs.short }}
        run: |
          echo "sha-$SHORT is $DIGEST"
          {
            echo "### Published sha-$SHORT"
            echo
            echo "Pin this digest to deploy it: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
