name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR pushes: a cancelled push-to-main run leaves a
  # merged commit without a green check, and CD publishes only green ones.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: auth
          POSTGRES_DB: auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth -d auth"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://auth:auth@localhost:5432/auth
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Installs the Bun version pinned by `packageManager` in package.json.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  # Builds the production image without pushing it, starts it against a real
  # Postgres and stops it, so a broken Dockerfile, entry point or shutdown
  # fails the PR instead of CD after merge.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag auth:ci .

      - name: Start it against Postgres
        run: |
          docker network create ci
          docker run -d --name db --network ci \
            -e POSTGRES_USER=auth -e POSTGRES_PASSWORD=auth -e POSTGRES_DB=auth postgres:16-alpine
          # A services file with one of each kind of client, mounted the way
          # a deployment would.
          cat > "$RUNNER_TEMP/services.json" <<'JSON'
          {"services": [
            {"name": "wiki", "roles": ["member", "admin"], "mfa_roles": ["admin"], "signup": "invite",
             "clients": [{"id": "wiki", "type": "confidential", "redirect_uris": ["https://wiki.example.com/auth/callback"]}]},
            {"name": "tasks", "roles": ["user"], "mfa_roles": [], "signup": "open", "default_role": "user",
             "clients": [{"id": "tasks-ios", "type": "public", "redirect_uris": ["com.example.tasks:/auth/callback"]}]}
          ]}
          JSON
          # Docker runs the image's own HEALTHCHECK; only its interval is
          # shortened, so the status turns within seconds. It keeps failing
          # while Postgres finishes starting and the migrations run.
          docker run -d --name auth --network ci --health-interval 1s \
            -v "$RUNNER_TEMP/services.json:/etc/auth/services.json:ro" \
            -e DATABASE_URL=postgres://auth:auth@db:5432/auth \
            -e ISSUER_URL=https://auth.example.com \
            -e SERVICES_FILE=/etc/auth/services.json \
            -e AUTH_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e SMTP_URL=smtp://localhost:2525 \
            -e EMAIL_FROM=auth@example.com \
            auth:ci
          for i in $(seq 1 60); do
            status=$(docker inspect auth --format '{{.State.Health.Status}}')
            [ "$status" = healthy ] && break
            sleep 1
          done
          docker logs auth
          if [ "$status" != healthy ]; then
            echo "::error::the image's HEALTHCHECK never passed (status: $status)"
            exit 1
          fi

      # The break-glass CLI runs inside the container, against the same
      # database, and the OIDC discovery document is served.
      - name: Use the CLI and discovery
        run: |
          docker exec auth bun cli.ts user create --username ci-admin --email ci-admin@example.com --access auth:admin --print-link \
            | grep -q '^activation link'
          docker exec auth bun -e "const r = await fetch('http://localhost:3000/.well-known/openid-configuration'); const d = await r.json(); process.exit(r.ok && d.issuer === 'https://auth.example.com' ? 0 : 1)"

      # docker stop sends SIGTERM, then SIGKILL after 10 seconds. A clean stop
      # exits 0 well before that; an unhandled SIGTERM shows as 137 at 10 s.
      - name: Stop it with SIGTERM
        run: |
          start=$(date +%s)
          docker stop --timeout 10 auth
          took=$(( $(date +%s) - start ))
          code=$(docker inspect auth --format '{{.State.ExitCode}}')
          docker logs auth | tail -n 3
          echo "exit code $code after ${took}s"
          if [ "$code" != 0 ] || [ "$took" -ge 10 ]; then
            echo "::error::the server did not stop cleanly on SIGTERM"
            exit 1
          fi
